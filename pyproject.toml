[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-film"
version = "0.1.0"
description = "The medium of the Eidograph: historic process curves, the tricolour pigment model, and the paper law, with their provenance"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["atlas_film"]
